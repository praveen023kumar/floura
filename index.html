    <script>
      (function() {
        const savedDarkMode = localStorage.getItem("patisserie_dark_mode");
        if (savedDarkMode === "true") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
